*{

padding:0;

body{

}

/* MENU */

.sidebar{
width:260px;
background:#1565c0;
color:white;
padding:20px;

height:100%;
overflow:auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo h2{
font-size:22px;
}

.logo p{
font-size:12px;

}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu a{
text-decoration:none;
color:white;
padding:14px;
border-radius:12px;
transition:.3s;
}

.menu a:hover{
background:rgba(255,255,255,.2);
}

/* CONTENIDO */

.main{
margin-left:260px;
padding:30px;
width:100%;
}

.banner{

color:white;
padding:40px;
border-radius:20px;
}

.banner h1{
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:25px;
}
